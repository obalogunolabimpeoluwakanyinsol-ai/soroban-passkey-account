[package]
name = "soroban-passkey-account"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.11", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils", "alloc"] }
# Pin ed25519-dalek to the 2.x line to prevent Cargo from selecting 3.0.0.
# soroban-env-host 22.1.x uses rand_chacha 0.3.1 / rand_core 0.6 in its
# testutils, which is incompatible with ed25519-dalek 3.0.0's rand_core 0.10
# CryptoRng bound. The upstream fix is stellar/rs-soroban-env#1706 (merged
# 2026-08-03) but was only released on the 27.x line, not backported to 22.x.
# This pin reproduces the same constraint fix locally.  2026-09-25.
ed25519-dalek = { version = ">=2.0.0, <3.0.0", features = ["rand_core"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
