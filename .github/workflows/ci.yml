name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32v1-none
          components: rustfmt,clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release / wasm32v1-none)
        run: cargo build --target wasm32v1-none --release

      - name: Clippy (wasm32v1-none)
        run: cargo clippy --target wasm32v1-none -- -D warnings

      - name: Run tests (native, testutils)
        # Dep conflict fixed 2026-09-25 (fix/test-compile-blocker):
        # soroban-env-host 22.1.x uses rand_chacha 0.3.1 / rand_core 0.6, but its
        # >=2.0.0 ed25519-dalek constraint lets Cargo pick 3.0.0 / rand_core 0.10,
        # breaking the CryptoRng bound in testutils.rs.  Upstream fix is
        # stellar/rs-soroban-env#1706 (merged 2026-08-03, 27.x only, not backported).
        # Downstream fix: Cargo.lock pinned to ed25519-dalek 2.2.0 via
        #   cargo update ed25519-dalek@3.0.0 --precise 2.2.0
        # plus dev-dependency ed25519-dalek = ">=2.0.0, <3.0.0" to hold the pin.
        # All 41 tests now pass; continue-on-error removed.
        run: cargo test
